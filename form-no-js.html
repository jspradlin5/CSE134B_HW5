
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form (No JavaScript) | Jude Spradlin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <p>Jude Spradlin</p>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="experience.html">Experience</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="form-no-js.html" aria-current="page">Form (No JS)</a></li>
                <li><a href="form-with-js.html">Form (With JS)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Contact Form (No JavaScript)</h1>
            <p>
                All fields are required. Names must be 1–100 characters,
                and comments must be 10–1000 characters.
                Please enter a valid email address.
            </p>

            <form action="https://httpbin.org/post" method="post">
                <div class="form-field">
                    <label for="name">Name (required)</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        minlength="1"
                        maxlength="100"
                        required>
                </div>

                <div class="form-field">
                    <label for="email">Email (required)</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-field">
                    <label for="comments">Comments (required)</label>
                    <textarea
                        id="comments"
                        name="comments"
                        rows="6"
                        minlength="10"
                        maxlength="1000"
                        required></textarea>
                </div>

                <input type="hidden" name="possible_bot" value="true">

                <button type="submit">Submit Form</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Jude Spradlin</p>
    </footer>
</body>
</html>
